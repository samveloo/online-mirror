<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Онлайн-зеркало</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px 16px 64px 16px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F4F5F7;
      color: #111;
    }

    .camera-wrapper {
      width: 100%;
      max-width: 420px;
      height: 75vh;
      border-radius: 20px;
      overflow: hidden;
      background: #E2E4E8;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .controls {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 14px 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      background: #111;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.7;
    }

    #stopBtn {
      background: #E2E4E8;
      color: #111;
    }
  </style>
</head>

<body>

  <div class="camera-wrapper">
    <video id="camera" autoplay playsinline muted></video>
  </div>

  <div class="controls">
    <button id="startBtn">Включить</button>
    <button id="switchBtn">Перевернуть камеру</button>
    <button id="stopBtn">Выключить</button>
  </div>

  <script>
    const video = document.getElementById('camera');
    const startBtn = document.getElementById('startBtn');
    const switchBtn = document.getElementById('switchBtn');
    const stopBtn = document.getElementById('stopBtn');
    
    let currentStream = null;
    let currentFacingMode = 'user';

    async function startCamera() {
      try {
        stopCamera();

        // Убрали жесткие width/height, чтобы камера брала полный угол обзора сенсора
        const constraints = {
          video: {
            facingMode: currentFacingMode
          },
          audio: false
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        await video.play();

        // Принудительно ставим минимальный зум, если телефон поддерживает управление зумом
        const [track] = currentStream.getVideoTracks();
        if (track && track.getCapabilities) {
          const capabilities = track.getCapabilities();
          if (capabilities.zoom) {
            await track.applyConstraints({
              advanced: [{ zoom: capabilities.zoom.min }]
            });
          }
        }
      } catch (err) {
        console.error('Ошибка:', err.name, err.message);
        alert(`Не удалось запустить камеру: ${err.name}`);
      }
    }

    function stopCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        currentStream = null;
      }
    }

    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);

    switchBtn.addEventListener('click', () => {
      currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
      startCamera();
    });
  </script>
</body>

</html>
