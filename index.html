<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мобильная камера</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
      background: #F8F9FA;
      color: #fff;
    }

    .camera-wrapper {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 9 / 16; /* Автоматически держит вертикальный формат */
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Класс для зеркалирования только фронтальной камеры */
    .mirror {
      transform: scaleX(-1);
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="camera-wrapper">
    <!-- Добавлен атрибут muted для стабильного автозапуска на iOS и Android -->
    <video id="camera" autoplay playsinline muted class="mirror"></video>
  </div>

  <div class="controls">
    <button id="startBtn">Включить</button>
    <button id="switchBtn">Сменить камеру</button>
    <button id="stopBtn">Выключить</button>
  </div>

  <script>
    const video = document.getElementById('camera');
    const startBtn = document.getElementById('startBtn');
    const switchBtn = document.getElementById('switchBtn');
    const stopBtn = document.getElementById('stopBtn');
    
    let currentStream = null;
    let currentFacingMode = 'user'; // 'user' или 'environment'

    async function startCamera() {
      try {
        stopCamera();

        const constraints = {
          video: {
            facingMode: currentFacingMode,
            // Меняем местами ширину и высоту под вертикальный экран
            width: { ideal: 720 },
            height: { ideal: 1280 }
          },
          audio: false
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;

        // Зеркалим только фронтальную камеру
        if (currentFacingMode === 'user') {
          video.classList.add('mirror');
        } else {
          video.classList.remove('mirror');
        }
      } catch (err) {
        console.error('Ошибка:', err.name, err.message);
        alert(`Не удалось запустить камеру: ${err.name}`);
      }
    }

    function stopCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        currentStream = null;
      }
    }

    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);

    // Переключение между фронтальной и основной камерой
    switchBtn.addEventListener('click', () => {
      currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
      startCamera();
    });
  </script>
</body>

</html>
